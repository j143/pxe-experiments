---
# ansible/roles/kvm/tasks/main.yml
# Install and verify the KVM / QEMU / libvirt stack on Ubuntu 24.04.

- name: Install KVM and virtualisation packages
  ansible.builtin.apt:
    name:
      - qemu-kvm
      - libvirt-daemon-system
      - libvirt-clients
      - virtinst
      - bridge-utils
      - cpu-checker
      - python3-libvirt      # needed by community.libvirt Ansible modules
      - python3-lxml         # needed to parse libvirt XML
    state: present
    update_cache: true

- name: Add admin user to libvirt and kvm groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - libvirt
      - kvm
    append: true

- name: Ensure libvirtd is started and enabled
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true

- name: Confirm KVM acceleration is available
  ansible.builtin.command: kvm-ok
  register: kvm_ok_result
  changed_when: false
  failed_when: "'KVM acceleration can be used' not in kvm_ok_result.stdout"

- name: Load 8021q kernel module (VLAN tagging)
  community.general.modprobe:
    name: 8021q
    state: present

- name: Persist 8021q across reboots
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: 8021q
    create: true
    mode: "0644"

- name: Disable the default libvirt NAT network
  community.libvirt.virt_net:
    name: default
    state: inactive
  ignore_errors: true

- name: Remove default libvirt network from autostart
  community.libvirt.virt_net:
    name: default
    autostart: false
  ignore_errors: true

- name: Enable IP forwarding on the physical host
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: Allow forwarding for libvirt bridges
  ansible.builtin.iptables:
    chain: FORWARD
    jump: ACCEPT
  become: true

- name: Enable MASQUERADE for virbr1 NAT
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: 192.168.100.0/24
    out_interface: eth0
    jump: MASQUERADE
  become: true

# ── Data Disk Setup (MEDIUM FIX) ─────────────────────────────────────────────

- name: Check if data disk has a filesystem
  ansible.builtin.command: blkid /dev/sdb
  register: blkid_result
  changed_when: false
  failed_when: false

- name: Format data disk as ext4 (only if empty)
  ansible.builtin.command: mkfs.ext4 -L pxe-data /dev/sdb
  when: blkid_result.rc != 0
  become: true

- name: Create mount point for data disk
  ansible.builtin.file:
    path: /mnt/pxe-data
    state: directory
    mode: "0755"

- name: Mount data disk persistently
  ansible.posix.mount:
    path: /mnt/pxe-data
    src: LABEL=pxe-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted
  become: true

- name: Ensure libvirt images directory lives on data disk
  ansible.builtin.file:
    path: /mnt/pxe-data/libvirt/images
    state: directory
    owner: libvirt-qemu
    group: libvirt
    mode: "0711"

- name: Symlink /var/lib/libvirt/images → data disk (idempotent)
  ansible.builtin.file:
    src: /mnt/pxe-data/libvirt/images
    dest: /var/lib/libvirt/images
    state: link
    force: true
  become: true

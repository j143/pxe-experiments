---
# ansible/roles/router/defaults/main.yml
# Configurable defaults for the router role.

# Debian Linux release used for the router VM base image.
# Debian generic cloud images have excellent Legacy BIOS support
# and include python3/sudo by default.
router_image_url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2"
router_image_name: "debian-12-generic-amd64.qcow2"

# tc-netem impairment applied to the router VM's client-facing interface (eth1).
# Simulates a lossy last-mile link to trigger PXE-E32 timeouts.
netem_packet_loss: "15%"
netem_latency: "20ms"

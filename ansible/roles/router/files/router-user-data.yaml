#cloud-config
# ---------------------------------------------------------------------------
# cloud-init user-data for the pxe-router Alpine Linux VM.
# Sets static IP addresses on both interfaces and installs iptables + iproute2.
# ---------------------------------------------------------------------------

hostname: pxe-router
disable_root: false

# Create a non-root user with sudo
users:
  - name: alpine
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: false

runcmd:
  # Install sudo and networking tools
  - apk update && apk add sudo iptables iproute2
  # Enable IP forwarding immediately
  - sysctl -w net.ipv4.ip_forward=1
  - echo 'net.ipv4.ip_forward=1' >> /etc/sysctl.conf
  # Load netem kernel modules
  - modprobe sch_netem
  # Persist netem across reboots
  - echo sch_netem >> /etc/modules

---
# ansible/roles/router/tasks/main.yml
# Build the router-VM image, define it in libvirt, and apply:
#   • iptables rules for inter-VLAN routing / DHCP relay
#   • tc-netem rules on the client-facing interface to simulate 15 % packet loss
#     + 20 ms base latency (reproduce PXE-E32 timeout conditions)

# ── Prerequisites ────────────────────────────────────────────────────────────

- name: Install dependencies for router image build
  ansible.builtin.apt:
    name:
      - qemu-utils          # qemu-img
      - cloud-image-utils   # cloud-localds (cloud-init seed)
      - isc-dhcp-relay      # optional: dhcrelay for DHCP relay if used on host
    state: present
    update_cache: true

# ── Router VM disk image ─────────────────────────────────────────────────────

- name: Ensure libvirt images directory exists
  ansible.builtin.file:
    path: /var/lib/libvirt/images
    state: directory
    owner: libvirt-qemu
    group: libvirt
    mode: "0711"

- name: Download Alpine Linux cloud image (lightweight router base)
  ansible.builtin.get_url:
    url: "{{ alpine_base_url }}/{{ alpine_image_name }}"
    dest: "/var/lib/libvirt/images/alpine-{{ alpine_patch_version }}-base.qcow2"
    checksum: "sha256:{{ alpine_base_url }}/{{ alpine_image_name }}.sha256"
    mode: "0640"
    owner: libvirt-qemu
    group: libvirt
  register: alpine_download

- name: Create router VM disk (copy-on-write overlay over base image)
  ansible.builtin.command:
    cmd: >
      qemu-img create -f qcow2 -F qcow2
      -b /var/lib/libvirt/images/alpine-{{ alpine_patch_version }}-base.qcow2
      /var/lib/libvirt/images/pxe-router.qcow2
      4G
    creates: /var/lib/libvirt/images/pxe-router.qcow2

- name: Copy router cloud-init user-data to host
  ansible.builtin.copy:
    src: router-user-data.yaml
    dest: /tmp/router-user-data.yaml
    mode: "0644"

- name: Generate cloud-init seed ISO for router VM
  ansible.builtin.command:
    cmd: >
      cloud-localds /var/lib/libvirt/images/pxe-router-seed.iso
      /tmp/router-user-data.yaml
    creates: /var/lib/libvirt/images/pxe-router-seed.iso

# ── Define and start router VM ───────────────────────────────────────────────

- name: Copy router VM XML definition to host
  ansible.builtin.copy:
    src: router-vm.xml
    dest: /tmp/router-vm.xml
    mode: "0644"

- name: Define router VM in libvirt
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('file', 'router-vm.xml') }}"

- name: Start router VM
  community.libvirt.virt:
    name: pxe-router
    state: running

- name: Wait for router VM to become reachable via SSH
  ansible.builtin.wait_for:
    host: 192.168.100.2
    port: 22
    delay: 10
    timeout: 120

# ── Configure routing and netem inside the router VM via delegate_to ─────────
# Add the router VM as a dynamic host so subsequent tasks can use delegate_to.

- name: Register router VM as a dynamic Ansible host
  ansible.builtin.add_host:
    name: pxe-router-vm
    ansible_host: 192.168.100.2
    ansible_user: root
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    groups: router_vms

- name: Enable IP forwarding in router VM
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  delegate_to: pxe-router-vm

- name: Apply iptables MASQUERADE rule (idempotent)
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    out_interface: eth0
    jump: MASQUERADE
    state: present
  delegate_to: pxe-router-vm

- name: Allow forwarding from virbr2 → virbr1 (idempotent)
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: eth1
    out_interface: eth0
    jump: ACCEPT
    state: present
  delegate_to: pxe-router-vm

- name: Allow established/related return traffic virbr1 → virbr2 (idempotent)
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: eth0
    out_interface: eth1
    ctstate:
      - RELATED
      - ESTABLISHED
    jump: ACCEPT
    state: present
  delegate_to: pxe-router-vm

- name: Apply tc-netem rules – {{ netem_packet_loss }} packet loss + {{ netem_latency }} latency on virbr2 leg
  ansible.builtin.shell: |
    set -e
    CURRENT=$(tc qdisc show dev eth1 2>/dev/null)
    if echo "${CURRENT}" | grep -q "netem"; then
      tc qdisc change dev eth1 root netem loss {{ netem_packet_loss }} delay {{ netem_latency }}
    else
      tc qdisc add dev eth1 root netem loss {{ netem_packet_loss }} delay {{ netem_latency }}
    fi
  args:
    executable: /bin/bash
  delegate_to: pxe-router-vm
  changed_when: true

- name: Verify tc-netem is active in router VM
  ansible.builtin.command: tc qdisc show dev eth1
  register: netem_status
  changed_when: false
  delegate_to: pxe-router-vm

- name: Show tc-netem status
  ansible.builtin.debug:
    msg: "{{ netem_status.stdout }}"

# dnsmasq PXE server configuration
# ─────────────────────────────────────────────────────────────────────────────
# Bind only to virbr1 (192.168.100.1) so dnsmasq never touches Azure's NIC.

# Interface binding
interface=virbr1
bind-interfaces
listen-address=192.168.100.1

# Do not act as a general-purpose DNS resolver
port=0
domain-needed
bogus-priv

# DHCP pool for nested PXE clients routed through the router VM
# (the router VM relays BOOTP from virbr2 → virbr1)
dhcp-range=192.168.100.50,192.168.100.200,255.255.255.0,1h

# Default gateway sent to DHCP clients
dhcp-option=3,192.168.100.1

# TFTP root
enable-tftp
tftp-root=/srv/tftp

# PXE boot file selection
# ─ Legacy BIOS clients → iPXE chainloader → pxelinux
dhcp-match=set:ipxe,175  # detect clients that are already running iPXE
dhcp-boot=tag:!ipxe,undionly.kpxe
dhcp-boot=tag:ipxe,http://192.168.100.1/boot/boot.ipxe

# Log DHCP transactions (useful for debugging PXE-E32 timeouts)
log-dhcp
log-facility=/var/log/dnsmasq-pxe.log

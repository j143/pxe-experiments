# dnsmasq PXE server configuration
# ─────────────────────────────────────────────────────────────────────────────
# Bind only to virbr1 (192.168.100.1) so dnsmasq never touches Azure's NIC.

# Interface binding
interface=virbr1
bind-interfaces
listen-address=192.168.100.254

# Do not act as a general-purpose DNS resolver
port=0
domain-needed
bogus-priv

# DHCP pool for nested PXE clients routed through the router VM
# (the router VM relays BOOTP from virbr2 → virbr1)
dhcp-range=set:core,192.168.100.50,192.168.100.200,255.255.255.0,1h
dhcp-range=set:legacy,192.168.200.50,192.168.200.200,255.255.255.0,1h

# Default gateway sent to DHCP clients
dhcp-option=tag:core,3,192.168.100.254
dhcp-option=tag:legacy,3,192.168.200.1

# TFTP root
enable-tftp
tftp-root=/srv/tftp

# ── TFTP Timeout Tuning (MEDIUM FIX) ─────────────────────────────────────────
# Under 15% packet loss (tc-netem), default TFTP retransmit timeouts cause
# clients to abort after ~12s. Increase retry window to survive the netem delay.
tftp-no-blocksize           # force 512-byte block size; reduces fragmentation risk
tftp-max=100                 # allow all clients to transfer simultaneously

# ── iPXE Chainloading (MEDIUM FIX — prevents boot loop) ──────────────────────
# Without user-class detection, iPXE clients would get undionly.kpxe again and
# loop forever. Tag iPXE clients using the "iPXE" user-class header (option 77)
# and serve them an HTTP boot script instead.
dhcp-match=set:ipxe,175          # client is already running iPXE (option 175)
dhcp-userclass=set:ipxe,iPXE     # also detect by user-class string
dhcp-boot=tag:!ipxe,undionly.kpxe
dhcp-boot=tag:ipxe,http://192.168.100.254/boot/boot.ipxe

# Log DHCP transactions (useful for debugging PXE-E32 timeouts)
log-dhcp
log-facility=/var/log/dnsmasq-pxe.log


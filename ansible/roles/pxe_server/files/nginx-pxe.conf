## Nginx virtual host – serves boot payloads over HTTP
## Listens on virbr1 (192.168.100.1) port 80 only.

server {
    listen 192.168.100.254:80 default_server;
    server_name _;

    root /srv/boot;
    autoindex on;

    access_log /var/log/nginx/pxe-access.log;
    error_log  /var/log/nginx/pxe-error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}

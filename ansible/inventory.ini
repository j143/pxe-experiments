# Ansible inventory for the PXE lab.
#
# Replace <HOST_PUBLIC_IP> with the value from `terraform output host_public_ip`
# or `terraform output ssh_command`.
#
# Example:
#   [pxe_host]
#   pxe-lab-host ansible_host=20.1.2.3 ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/id_rsa

[pxe_host]
pxe-lab-host ansible_host=<HOST_PUBLIC_IP> ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/id_rsa

[pxe_host:vars]
ansible_python_interpreter=/usr/bin/python3
